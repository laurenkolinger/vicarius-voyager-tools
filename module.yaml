# ==============================================================================
# MODULE INTERFACE DEFINITION: voyager_tools
# ==============================================================================
# The Atlas control panel (module voyager_tools; the slug, the address
# /voyager-tools and the actor prefix keep the module name): the restricted settings and tools of the atlas, the Voyager runs, the
# manual edit and the desktop (atlas processing order, camera model, prompts
# doc, manual edit settings, Shelf copy, clean manual edit run, Voyager runs,
# parameter defaults, rewind, spot redo, clean workbench, module locks, module
# details, appearance, space floors, GPU ladder, settings history), served as
# a native blueprint inside the desktop host. This contract is seeded by plan task A7
# with the parameter store library; task B6' adds the `ui` block (style
# voyager_tools) when the page ships. Spec: section 7 of
# /mnt/rip/vicarius_drive/docs/superpowers/specs/2026-09-03-voyager-program-design.md
# ==============================================================================

name: "voyager_tools"
display_name: "Atlas control panel"
tags: ["3D", "TCRMP"]
hidden: false
hidden_reason: ""
version: "0.3.0"
description: "The restricted settings and tools of the atlas, the Voyager runs, the manual edit and the desktop: the processing order, the camera model per season, the manual edit settings and the Shelf copy setting, the Voyager run switches, the parameter defaults in voyagerparams, rewind and spot redo, clean workbench and clean manual edit run, the space floors, the GPU ladder, module locks, module details, the desktop appearance, and the settings history."
author: "Lauren Olinger"
created: "2026-09-04"

# A tool page, not a processing stage: it produces no datasets and mints no runs.
type: "tool"

# Every route of this module answers 401 outside admin mode; the desktop shows
# its item only in admin mode.
admin_only: true

# Native blueprint inside the desktop host (vicarius_ui_os/voyager_tools_views.py
# mounts voyagertools/views.py at /voyager-tools). style routes the module tile
# to that page; admin_only keeps the tile hidden and every route at 401 outside
# admin mode. No launch block: nothing runs on its own port (standalone_app.py
# on 5098 is a smoke-test host the platform never starts).
ui:
  style: "voyager_tools"
  admin_only: true
  page: "/voyager-tools"
  fragment: "/voyager-tools/fragment"

inputs: []
outputs: []

runtime:
  python_version: ">=3.10"
  gpu_required: false
  dependencies: "requirements.txt"
  estimated_time: "interactive"

notes: |
  voyagertools/views.py is the blueprint (page, fragment with ?tool=panel
  for the atlas, JSON API of the eight tools); static/vt_settings.js holds
  the settings, desktop and history panes, which call the desktop's own
  /api/settings routes (vicarius_ui_os/settings_views.py); order_tool.py, clean_workbench.py, clean_manual_edit.py,
  rewind.py and camera_tool.py hold the tool logic; scripts/rewind_chunk.py
  runs under metashape -r to drop a chunk (with --fake for tests).
  voyagertools/paramsstore.py is the only reader and writer of the
  voyagerparams checkout (vicarius/modules/voyagerparams/github_repo/): it
  lists, loads, diffs and saves parameter versions, branches and custom run
  sets, applies the versioning rule of spec section 7.7, and commits and
  pushes through an injectable git runner. voyagertools/params_schema_voyager1.yaml
  is the editor schema: every Voyager 1 key with label, tooltip, type, default
  and validation. Tests: /usr/bin/python3 -m unittest discover -s tests -v.
